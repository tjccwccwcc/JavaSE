name: Export Multi-Arch Image to Tar

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: '源镜像地址'
        required: true
        default: 'ghcr.io/prometheus-operator/prometheus-config-reloader:v0.78.2'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and Save Available Architectures
        run: |
          mkdir -p artifacts
          IMG="${{ github.event.inputs.source_image }}"
          
          # 拉取并导出 amd64
          if docker pull --platform linux/amd64 "$IMG"; then
            docker save -o artifacts/image-amd64.tar "$IMG"
          fi
          
          # 尝试拉取并导出 arm64（不存在则跳过不报错）
          if docker pull --platform linux/arm64 "$IMG"; then
            docker save -o artifacts/image-arm64.tar "$IMG"
          else
            echo "该镜像不支持 linux/arm64，已自动跳过。"
          fi

      - name: Upload Image Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exported-images
          path: artifacts/*.tar
          retention-days: 1
